[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-engine"
version = "0.1.0"
description = "Obsidian + ChromaDB self-evolving knowledge retrieval engine"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "jialangli" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
keywords = ["knowledge-base", "rag", "chromadb", "obsidian", "mcp", "semantic-search", "hybrid-retrieval"]

dependencies = [
    "chromadb>=1.5.0",
    "python-frontmatter>=1.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "mcp>=1.0.0",
    "typer>=0.9.0",
]

# BGE 神经语义 / 两阶段 Rerank 为可选能力：不安装时自动降级为 LSA / 纯 RRF，
# 功能完整可用（kb_embed / rerank 均惰性导入）。单独安装：pip install -e ".[bge]"
[project.optional-dependencies]
bge = [
    "sentence-transformers>=2.2.0",
    "huggingface-hub>=0.17.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "isort>=5.12.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
kb = "kb_engine.cli:app"
kb-sync = "kb_engine.sync_obsidian_to_chroma:main"
kb-api = "kb_engine.kb_api_server:main"
kb-audit = "kb_engine.kb_audit:main"
kb-eval = "kb_engine.eval_retrieval:main"

[project.urls]
Homepage = "https://github.com/jialangli/obsidian-chromadb-self-evolving-kb"
Documentation = "https://jialangli.github.io/obsidian-chromadb-self-evolving-kb/"
Repository = "https://github.com/jialangli/obsidian-chromadb-self-evolving-kb.git"
Issues = "https://github.com/jialangli/obsidian-chromadb-self-evolving-kb/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
